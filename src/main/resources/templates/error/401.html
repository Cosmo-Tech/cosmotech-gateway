<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{error.401.title}">401 - Unauthorized</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 6rem;
      margin: 0;
      color: #a78bfa;
    }
    p {
      font-size: 1.25rem;
      margin: 0.5rem 0 1.5rem;
    }
    a {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background-color: #a78bfa;
      color: #0f172a;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    a:hover {
      background-color: #8b5cf6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 th:text="#{error.401.title}">401</h1>
    <p th:text="#{error.401.text}">You must be authenticated to access this page.</p>
    <a href="/" th:text="#{error.back}">Back to home</a>
  </div>
</body>
</html>
