logging:
  level:
   org.springframework.cloud.gateway: INFO
   org.springframework.security: INFO
   com.cosmotech: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: "${csm.platform.gateway.port}"

csm:
  platform:
    gateway:
      openApiAggregation:
        enabled: true
        serverUrls: {}

management:
  server:
    port: 8061
  endpoints:
    web:
      exposure:
        include: "*"
spring:
  webflux:
    base-path: ${csm.platform.gateway.contextPath}
  application:
    name: cosmotech-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay=
          routes:
            # Public OpenAPI descriptions follow the /openapi/{service} convention.
            - id: test-service-openapi
              uri: http://localhost:8040
              predicates:
                - Path=/openapi/test-service
              filters:
                - RewritePath=/openapi/test-service, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${csm.platform.gateway.identityProvider.serverBaseUrl}/realms/${csm.platform.gateway.identityProvider.identity.tenantId}/protocol/openid-connect/certs"
      client:
        provider:
          keycloak:
            authorization-uri: "${csm.platform.gateway.identityProvider.serverBaseUrl}/realms/${csm.platform.gateway.identityProvider.identity.tenantId}/protocol/openid-connect/auth"
            issuer-uri: "${csm.platform.gateway.identityProvider.serverBaseUrl}/realms/${csm.platform.gateway.identityProvider.identity.tenantId}"
            token-uri: "${csm.platform.gateway.identityProvider.serverBaseUrl}/realms/${csm.platform.gateway.identityProvider.identity.tenantId}/protocol/openid-connect/token"
        registration:
          keycloak-client:
            provider: keycloak
            client-id: "${csm.platform.gateway.identityProvider.identity.clientId}"
            client-authentication-method: none
            authorization-grant-type: "authorization_code"
            scope: ["openid"]


# Aggregation of the OpenAPI descriptions exposed by every service routed through
# the gateway. Each entry below is proxied through a gateway route (see spring.cloud.gateway
# routes above). OpenAPI descriptions are public under /openapi/{service}; API calls
# remain protected by the gateway's centralized OAuth2 configuration.
# See docs/openapi-aggregation.md for the full list of available configuration keys.
springdoc:
  swagger-ui:
    path: "${csm.platform.gateway.swagger-ui.path:/swagger-ui.html}"
    use-root-path: "${csm.platform.gateway.swagger-ui.use-root-path:true}"
    # Reuses the OAuth authorization across aggregated services and page reloads.
    persist-authorization: "${csm.platform.gateway.swagger-ui.persist-authorization:true}"
    # One entry per aggregated service. "url" is the gateway path, not the downstream
    # service's own address (which stays defined in the gateway routes only).
    urls-primary-name: "${csm.platform.gateway.swagger-ui.urls-primary-name:cosmotech-gateway}"
    urls:
      - name: cosmotech-gateway
        url: /v3/api-docs
      - name: test-service
        url: /openapi/test-service
    oauth:
      # Swagger UI runs in the browser and must use a public Keycloak client without
      # a client secret. PKCE secures the authorization-code exchange.
      client-id: "${csm.platform.gateway.identityProvider.identity.clientId}"
      scopes: "${csm.platform.gateway.swagger-ui.oauth.scopes:openid,email,profile}"
      use-basic-authentication-with-access-code-grant: "${csm.platform.gateway.swagger-ui.oauth.use-basic-authentication-with-access-code-grant:false}"
      use-pkce-with-authorization-code-grant: "${csm.platform.gateway.swagger-ui.oauth.use-pkce-with-authorization-code-grant:true}"

---
# Any profile other than 'dev' (prod, docker, ...) switches to JSON console logs,
# meant to be scraped by log aggregators (ELK, Loki, ...); MDC fields set by
# AccessLogGlobalFilter are automatically included as top-level JSON keys.
spring:
  config:
    activate:
      on-profile: "!dev"
logging:
  structured:
    format:
      console: logstash
