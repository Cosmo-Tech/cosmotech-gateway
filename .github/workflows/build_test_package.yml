name: Build, Test and Package

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - '*'
      - '!*-test'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'main'
      - 'release/**'
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Build with Gradle
        run: >
            ./gradlew
            clean
            build
            -x test
            --no-build-cache
            --rerun-tasks
            --refresh-dependencies

  unit_tests:
    runs-on: ubuntu-latest
    needs:
      - build

    permissions: read-all

    if: github.event_name != 'pull_request_target'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Run unit tests
        run: ./gradlew test -x spotlessCheck

  scan_and_push_container_images_to_registries:
    runs-on: ubuntu-latest
    needs:
      - unit_tests
    permissions:
      packages: write
      contents: read
      security-events: write
    env:
      DOCKER_BUILDKIT: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    ## Do not launch scan/push job if the PR is created by dependabot
    ## This job needs to build a run API image (via jib) that target base image stored in private repository.
    ## Credentials should not be shared to dependabot (for security reason)
    ## For PR related to version upgrade, we can skip this job.
    ## The minimal steps to performed are build/tests.
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all tags since Gradle project version is built upon SCM
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Retrieve branch or tag name
        id: refvar
        run: echo "gitRefName=${GITHUB_REF#refs/*/}" >> "${GITHUB_OUTPUT}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Build local Container Image for scanning
        run: >
            ./gradlew
            jibDockerBuild
            -Djib.to.image=com.cosmotech/cosmotech-gateway:${{ github.sha }}
            -Pbaseimage.repository.user="${{ secrets.BASEIMAGE_REPOSITORY_USER }}"
            -Pbaseimage.repository.password="${{ secrets.BASEIMAGE_REPOSITORY_PASSWORD }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        id: scan
        # Add TRIVY_DB_REPOSITORY due to ratelimit issue
        # https://github.com/aquasecurity/trivy-action/issues/389
        env:
          DOCKLE_HOST: "unix:///var/run/docker.sock"
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

        # TODO For now, do not block if the container scan action returns issues
        continue-on-error: true

        with:
          image-ref: com.cosmotech/cosmotech-gateway:${{ github.sha }}
          format: "sarif"
          severity: "CRITICAL,HIGH"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Archive container image scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: container-image-scan-report
          path: "trivy-results.sarif"
          retention-days: 3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Gateway Container Image (sha) to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker image tag com.cosmotech/cosmotech-gateway:${{github.sha}} \
            ghcr.io/cosmo-tech/cosmotech-gateway:${{github.sha}}
          docker image push ghcr.io/cosmo-tech/cosmotech-gateway:${{github.sha}}

      - name: Push Gateway Container Image (tag) to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker image tag com.cosmotech/cosmotech-gateway:${{github.sha}} \
            ghcr.io/cosmo-tech/cosmotech-gateway:${{ steps.refvar.outputs.gitRefName }}
          docker image push ghcr.io/cosmo-tech/cosmotech-gateway:${{ steps.refvar.outputs.gitRefName }}

      - name: Push Gateway Container Image (latest) to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: |
          docker image tag com.cosmotech/cosmotech-gateway:${{github.sha}} \
            ghcr.io/cosmo-tech/cosmotech-gateway:latest
          docker image push ghcr.io/cosmo-tech/cosmotech-gateway:latest