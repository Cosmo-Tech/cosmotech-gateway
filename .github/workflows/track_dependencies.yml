name: Track Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dependency_track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Track dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew cyclonedxBom
      - name: Upload CycloneDX BOM
        uses: actions/upload-artifact@v7
        with:
          name: cosmotech-api-bom
          path: build/reports/cosmotech-api-bom.xml
          overwrite: true
      - name: Upload cyclonedx bom to dependency
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: 'fa562bcf-b0c9-4adc-af63-706091e3e39a'
          bomfilename: 'build/reports/cosmotech-gateway-bom.xml'
